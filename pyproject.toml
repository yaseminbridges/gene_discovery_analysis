[tool.poetry]
name = "gene-discovery_analysis"
version = "0.1.0"
description = ""
authors = ["Yasemin Bridges <y.bridges@qmul.ac.uk>"]
readme = "README.md"
packages = [{include = "gene_discovery_analysis", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0.3"
pydantic = "^1.10.7"
pyyaml = "^6.0.1"
click = "^8.1.6"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py39", "py310"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
reverse_relative = true

[tool.poetry.dev-dependencies]
pytest = "^7.1.2"
pylint = "^2.15.6"
pycodestyle = "^2.10.0"
coverage = "^6.5.0"

[tool.poetry.scripts]
analyse = "gene_discovery_analysis.cli:main"